<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}">NEU CP · NEU MTN</a>
      <nav>
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Accueil</a>
        <a href="{{ '/dashboard-exemple/' | relative_url }}"{% if page.url contains 'dashboard-exemple' %} class="active"{% endif %}>Exemple de tableau de bord</a>
        <a href="{{ '/dashboard/' | relative_url }}"{% if page.url contains 'dashboard' and page.url != '/dashboard-exemple/' %} class="active"{% endif %}>Dashboard</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>Conçu et opéré par Henri, consultant indépendant — analyse fonctionnelle, données de trésorerie.</p>
      <p><a href="mailto:contact@example.com">contact@example.com</a></p>
    </footer>
  </div>
</body>
</html>
