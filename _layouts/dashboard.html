<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}"> 
<meta name="robots" content="index, follow"> 
<meta name="author" content="{{ site.author | default: site.title | escape }}">
<meta property="og:type" content="website"> 
<meta property="og:locale" content="fr_FR"> 
<meta property="og:title" content="{{ page.title | default: site.title | escape }}"> 
<meta property="og:description" content="{{ page.description | default: site.description | escape }}"> 
<meta property="og:url" content="{{ page.url | absolute_url }}"> 
<meta property="og:site_name" content="{{ site.title | escape }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/dashboard.css' | relative_url }}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-zoom/2.2.0/chartjs-plugin-zoom.min.js"></script>
</head>
<body>
  <div class="wrap">{% include nav.html %}</div>
  <main class="dash-shell">
    {{ content }}
  </main>
  <div class="wrap">{% include footer.html %}</div>

  <script>window.NEUCP_DATA_URL = "{{ '/tcn_historique.json' | relative_url }}";</script>
  <script>window.NEUCP_TAUX_URL = "{{ '/tcn_taux_emission_mensuel.json' | relative_url }}";</script>
  <script>window.NEUCP_REF_ESTR_URL = "{{ '/ref_estr_mensuel.json' | relative_url }}";</script>
  <script>window.NEUCP_REF_BTF_URL = "{{ '/ref_btf_mensuel.json' | relative_url }}";</script>
  <script src="{{ '/assets/js/data-loader.js' | relative_url }}"></script>
  {% for ind in page.indicators %}
  <script src="{{ ind | relative_url }}"></script>
  {% endfor %}
</body>
</html>
